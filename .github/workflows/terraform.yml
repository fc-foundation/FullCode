name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/policy/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/policy/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  CONFTEST_VERSION: "0.55.0"

jobs:
  fmt-validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - infra/terraform/modules/naming
          - infra/terraform/modules/resource-group
          - infra/terraform/examples/naming-check
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

  naming-check:
    name: naming convention
    runs-on: ubuntu-latest
    needs: fmt-validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/terraform/examples/naming-check
        run: terraform init -backend=false

      - name: terraform plan
        working-directory: infra/terraform/examples/naming-check
        run: terraform plan -out=tfplan.binary

      - name: terraform show -json
        working-directory: infra/terraform/examples/naming-check
        run: terraform show -json tfplan.binary > plan.json

      - name: install conftest
        run: |
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/

      - name: conftest test (naming convention)
        run: conftest test --policy infra/policy infra/terraform/examples/naming-check/plan.json
